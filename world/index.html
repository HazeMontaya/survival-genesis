<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Survival Genesis · Agent World</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05070b;color:#dce8f5;font:12px Inter,system-ui,sans-serif}#world{width:100vw;height:100vh;background:radial-gradient(circle at 50% 50%,#142031,#05070b 62%,#020307)}.hud,.nav,.feed,.command,.inspector{position:fixed;z-index:5;background:#07101ad9;border:1px solid #203248;backdrop-filter:blur(10px);box-shadow:0 16px 50px #0008;border-radius:10px}.hud{left:16px;top:14px;padding:11px 14px}.brand{font-weight:900;letter-spacing:.18em;font-size:16px}.brand span{color:#68e7ff}.meta{margin-top:5px;color:#7890a9;font:9px ui-monospace,monospace}.nav{left:16px;top:88px;padding:5px;display:flex;gap:4px}.nav button,.command button{background:#0b1521;border:1px solid #22364b;color:#9fb3c9;padding:7px 9px;border-radius:6px;cursor:pointer}.nav button.active{border-color:#65e8ff;color:#fff}.feed{left:16px;bottom:16px;width:340px;max-height:220px;overflow:auto;padding:10px}.feed h3,.command h3{margin:0 0 8px;font-size:10px;letter-spacing:.12em;color:#7f9bb5}.event{padding:6px 0;border-top:1px solid #172536}.event b{color:#8fe8bd}.command{right:16px;top:14px;padding:10px}.inspector{right:16px;bottom:16px;width:330px;max-height:42vh;overflow:auto;padding:14px;display:none}.close{float:right;background:none;border:0;color:#7890a9;font-size:20px}.kv{display:grid;grid-template-columns:90px 1fr;gap:6px;margin-top:10px}.kv b{color:#7890a9;font-size:9px}.room{fill:#0b121c;stroke:#1e3247;stroke-width:2}.roomlabel{fill:#607992;font:11px ui-monospace,monospace;letter-spacing:.18em}.entity{cursor:pointer}.label{pointer-events:none}.agent{filter:drop-shadow(0 0 7px #54e8a2)}@keyframes pulse{50%{opacity:.5}}.working{animation:pulse .8s infinite}.searching{animation:pulse .5s infinite}.blocked{opacity:.45}.error{filter:drop-shadow(0 0 8px #ff526f)}.complete{opacity:.7}</style></head><body><svg id="world" viewBox="-1000 -600 2000 1200"><defs><radialGradient id="core"><stop stop-color="#9b7cff"/><stop offset=".5" stop-color="#352a65"/><stop offset="1" stop-color="#080a10"/></radialGradient></defs><g id="rooms"></g><g id="relations"></g><g id="entities"></g></svg><div class="hud"><div class="brand">SURVIVAL <span>GENESIS</span></div><div class="meta" id="meta">AGENT WORLD · CONNECTING</div></div><div class="nav"><button data-view="world" class="active">WORLD</button><button data-view="network">NETWORK</button><button data-view="knowledge">KNOWLEDGE</button><button data-view="work">WORK</button><button data-view="history">HISTORY</button></div><div class="command"><h3>COMMAND CENTER</h3><button onclick="cmd('tick')">TICK</button><button onclick="cmd('start')">START</button><button onclick="cmd('stop')">STOP</button></div><div class="feed"><h3>RUNTIME FEED</h3><div id="events">warte auf Ereignisse…</div></div><div class="inspector" id="inspector"><button class="close" onclick="hide()">×</button><h2 id="title"></h2><div id="sub"></div><div class="kv" id="data"></div></div><script>
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";let state,mode="world",p={};const colors={core:"#9b7cff",agent:"#61e8af",capability:"#63ddff",project:"#ffbf69",task:"#8fa9ff",workflow:"#ff7a9e",stage:"#b5c7ff",artifact:"#d98cff",skill:"#ffe066",tool:"#7fd1ff",evidence:"#f4d35e",message:"#ff8fab",order:"#66d9ef",economy:"#6de8a5",reserve:"#8a9bb0"};function E(t,a={}){let x=document.createElementNS(NS,t);for(let[k,v]of Object.entries(a))x.setAttribute(k,v);return x}function roomRects(){let rs=state.world.rooms||{};$("rooms").innerHTML="";for(let[k,v]of Object.entries(rs)){let[x,y]=v,g=E("g");g.append(E("rect",{class:"room",x:x-170,y:y-120,width:340,height:240,rx:24}),E("text",{class:"roomlabel",x:x-145,y:y-92}));g.lastChild.textContent=k.toUpperCase();$("rooms").append(g)}}function show(e){$("title").textContent=e.name;$("sub").textContent=e.type+" · "+e.state+" · "+e.room;let o={ID:e.id,ACTIVITY:e.activity,OWNER:e.owner_id||"-",REASON:e.reason||"-",META:JSON.stringify(e.metadata||{})};$("data").innerHTML=Object.entries(o).map(([k,v])=>"<b>"+k+"</b><span>"+String(v).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+"</span>").join("");$("inspector").style.display="block"}function hide(){$("inspector").style.display="none"}function draw(){let es=state.world.entities||[],rs=state.world.relations||[];p=Object.fromEntries(es.map(e=>[e.id,[e.x||0,e.y||0]]));roomRects();$("relations").innerHTML="";$("entities").innerHTML="";for(let r of rs){if(!p[r.source]||!p[r.target]||(mode==="knowledge"&&r.layer!=="knowledge")||(mode==="network"&&r.layer!=="neural")||(mode==="work"&&r.layer!=="work"))continue;let a=p[r.source],b=p[r.target];$("relations").append(E("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"#31506a","stroke-width":Math.max(1,(r.intensity||1)*2),opacity:.55}))}for(let e of es){if(mode==="knowledge"&&!["evidence","skill","capability"].includes(e.type)||mode==="work"&&!["project","task","workflow","stage"].includes(e.type)||mode==="network"&&!["agent","message"].includes(e.type)||mode==="history")continue;let[x,y]=p[e.id]||[0,0],c=colors[e.type]||"#9aa",g=E("g",{class:"entity "+(e.activity||"")+(e.type==="agent"?" agent":"")}),sh=e.type==="agent"?E("circle",{cx:x,cy:y,r:22,fill:"#071a14",stroke:c,"stroke-width":2}):e.type==="task"?E("rect",{x:x-11,y:y-11,width:22,height:22,rx:4,fill:"#0c1423",stroke:c}):E("circle",{cx:x,cy:y,r:e.type==="core"?60:e.type==="workflow"?18:e.type==="stage"?11:14,fill:e.type==="core"?"url(#core)":"#0a121d",stroke:c,"stroke-width":1.8});g.append(sh);let t=E("text",{class:"label",x,y:y+35,"text-anchor":"middle",fill:"#d9e6f5","font-size":e.type==="agent"?10:8});t.textContent=e.name.length>24?e.name.slice(0,22)+"…":e.name;g.append(t);g.onclick=()=>show(e);$("entities").append(g)}$("meta").textContent="AGENT WORLD · "+(state.runtime?.running?"LIVE":"STANDBY")+" · "+es.length+" OBJECTS · "+rs.length+" RELATIONS · CASH €"+Number(state.ledger?.cash_eur||0).toFixed(2)}async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}async function refresh(){try{state=await api("/api/state");draw();let ev=await api("/api/events?limit=18");$("events").innerHTML=ev.events.map(x=>"<div class=event><b>"+x.kind+"</b> · "+x.actor+"<br><span>"+new Date(x.ts).toLocaleTimeString()+"</span></div>").join("")||"keine Events"}catch(e){$("meta").textContent="AGENT WORLD · ERROR · "+e.message}}async function cmd(c){try{await api("/api/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command:c})});refresh()}catch(e){alert(e.message)}}document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.view;draw()});refresh();setInterval(refresh,3000);
</script></body></html>
