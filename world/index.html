<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survival Genesis · Genesis-Welt</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020308;color:#e8f2ff;font:12px Inter,system-ui,sans-serif}
#world{width:100vw;height:100vh;display:block;background:radial-gradient(circle at 50% 48%,#101b2b 0,#050810 48%,#010207 100%)}
.hud{position:fixed;z-index:5;left:18px;top:16px;pointer-events:none;text-shadow:0 2px 12px #000}.brand{font-weight:900;letter-spacing:.2em;font-size:18px}.brand span{color:#6de8ff}.meta{margin-top:6px;color:#71839a;font:10px ui-monospace,monospace;letter-spacing:.1em}
.toolbar{position:fixed;right:18px;top:16px;z-index:8;display:flex;gap:7px}.toolbar button{background:#070d16dd;border:1px solid #25364b;color:#cbd8e8;padding:8px 11px;border-radius:7px;cursor:pointer}.toolbar button:hover{border-color:#65e8ff;color:#fff}
#inspector{display:none;position:fixed;right:18px;bottom:18px;width:350px;max-height:52vh;overflow:auto;z-index:9;background:#060b13f2;border:1px solid #294057;border-radius:10px;padding:14px;box-shadow:0 20px 70px #000b}.close{float:right;background:none;border:0;color:#7f91a8;font-size:20px;cursor:pointer}.muted{color:#71839a}.kv{display:grid;grid-template-columns:100px 1fr;gap:6px;margin-top:12px}.kv b{color:#71839a;font-size:9px;text-transform:uppercase}
.entity{cursor:pointer}.entity:hover .shape{filter:brightness(1.5)}.label{pointer-events:none}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}.alive{animation:pulse 2.4s infinite}.construction{animation:pulse 1s infinite}
</style>
</head>
<body>
<svg id="world" viewBox="-1000 -650 2000 1300" aria-label="Lebende Genesis-Welt">
<defs>
<radialGradient id="space"><stop stop-color="#16253a"/><stop offset=".6" stop-color="#060b14"/><stop offset="1" stop-color="#010207"/></radialGradient>
<radialGradient id="core"><stop stop-color="#9d80ff"/><stop offset=".3" stop-color="#3b2b70"/><stop offset="1" stop-color="#090b12"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="25"/></filter>
</defs>
<rect x="-1000" y="-650" width="2000" height="1300" fill="url(#space)"/>
<g id="stars"></g><g id="relations"></g><g id="entities"></g><g id="flows"></g>
</svg>
<div class="hud"><div class="brand">SURVIVAL <span>GENESIS</span></div><div class="meta" id="meta">KEIM · INITIALISIERE</div></div>
<div class="toolbar"><button id="tick">ZYKLUS</button><button id="run">DAUERBETRIEB</button><button id="sync">SYNCHRONISIEREN</button></div>
<div id="inspector"><button class="close" id="close">×</button><h2 id="title"></h2><div class="muted" id="sub"></div><div class="kv" id="data"></div></div>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("world"),$=id=>document.getElementById(id);let state=null,view={x:0,y:0,z:1};
const palette={core:"#9b7cff",agent:"#62e8b0",capability:"#63ddff",project:"#ffbf69",task:"#8fa9ff",artifact:"#d98cff",connector:"#ff6f9b",skill:"#ffe066",tool:"#7fd1ff"};
function el(t,a={}){const x=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);return x}
for(let i=0;i<260;i++)$("stars").append(el("circle",{cx:-1000+Math.random()*2000,cy:-650+Math.random()*1300,r:(.2+Math.random()*1.3).toFixed(2),fill:"#b8d8ff",opacity:(.12+Math.random()*.55).toFixed(2)}));
function show(e){$("title").textContent=e.name;$("sub").textContent=e.type+" · "+e.state;$("data").innerHTML=Object.entries({ID:e.id,ELTERN:e.parent_id||"-",OWNER:e.owner_id||"-",GRUND:e.reason||"-",ERSTELLT:e.created_at||"-"}).map(([k,v])=>"<b>"+k+"</b><span>"+String(v).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+"</span>").join("");$("inspector").style.display="block"}
function positions(entities){const p={};p["genesis-core"]=[0,0];const groups={agent:[],capability:[],project:[],task:[],artifact:[],connector:[],skill:[],tool:[]};entities.forEach(e=>{if(groups[e.type])groups[e.type].push(e)});const rings={agent:[250,0],project:[410,-120],capability:[420,190],task:[600,0],artifact:[610,230],connector:[610,-260],skill:[760,150],tool:[760,-120]};Object.entries(groups).forEach(([type,list])=>{const [r,off]=rings[type]||[500,0];list.forEach((e,i)=>{const a=(i/Math.max(1,list.length))*Math.PI*2+off*.001;p[e.id]=[Math.cos(a)*r,Math.sin(a)*r*.72]})});return p}
function draw(s){state=s;$("relations").innerHTML="";$("entities").innerHTML="";$("flows").innerHTML="";
const world=s.world||{}; const ents=world.entities||[], rels=world.relations||[],p=positions(ents); /* world.entities */
for(const r of rels){if(!p[r.source]||!p[r.target])continue;const [x1,y1]=p[r.source],[x2,y2]=p[r.target];$("relations").append(el("path",{d:"M"+x1+" "+y1+" L"+x2+" "+y2,fill:"none",stroke:"#35546c","stroke-width":r.kind==="works_on"?2:1.2,"stroke-dasharray":r.kind==="works_on"?"":"5 9",opacity:.65}))}
const core=el("g",{class:"entity"});core.append(el("circle",{cx:0,cy:0,r:145,fill:"#9b7cff",opacity:.07,filter:"url(#soft)"}),el("circle",{class:"shape",cx:0,cy:0,r:86,fill:"url(#core)",stroke:"#9b7cff","stroke-width":2,filter:"url(#glow)"}));let ct=el("text",{x:0,y:-2,"text-anchor":"middle",fill:"#fff","font-size":22,"font-weight":900});ct.textContent="GENESIS";let cs=el("text",{x:0,y:19,"text-anchor":"middle",fill:"#c4b6ff","font-size":9,"letter-spacing":2});cs.textContent="KEIM";core.append(ct,cs);core.onclick=()=>show({id:"genesis-core",type:"core",name:"GENESIS",state:"alive",reason:s.company?.mission||""});$("entities").append(core);
for(const e of ents){if(e.id==="genesis-core")continue;const [x,y]=p[e.id]||[0,0],c=palette[e.type]||"#8ca2b8",g=el("g",{class:"entity "+(e.state==="active"?"alive":"")});let sh;if(e.type==="agent")sh=el("circle",{class:"shape",cx:x,cy:y,r:26,fill:"#0b1e18",stroke:c,"stroke-width":2});else if(e.type==="project")sh=el("rect",{class:"shape",x:x-25,y:y-25,width:50,height:50,rx:10,fill:"#24190b",stroke:c,"stroke-width":2,transform:"rotate(45 "+x+" "+y+")"});else if(e.type==="task")sh=el("rect",{class:"shape",x:x-13,y:y-13,width:26,height:26,rx:5,fill:"#0d1428",stroke:c,"stroke-width":1.5});else sh=el("circle",{class:"shape",cx:x,cy:y,r:e.type==="capability"?18:15,fill:"#0b1220",stroke:c,"stroke-width":1.7});
g.append(sh);let t=el("text",{class:"label",x,y:y+43,"text-anchor":"middle",fill:"#d9e6f5","font-size":e.type==="agent"?10:8,"font-weight":e.type==="agent"?800:500});t.textContent=e.name.length>25?e.name.slice(0,23)+"…":e.name;g.append(t);g.onclick=()=>show(e);$("entities").append(g);
if(e.state==="in_entwicklung"||e.state==="entdeckt"||e.state==="geplant")$("flows").append(el("circle",{cx:x,cy:y,r:34,fill:"none",stroke:c,"stroke-width":1,"stroke-dasharray":"3 7",class:"construction"}));
}
const gaps=s.world?.gaps?.length||0,active=(s.tasks||[]).filter(t=>t.status==="active").length;
$("meta").textContent="WELT · "+(s.runtime?.running?"DAUERBETRIEB":"BEREIT")+" · "+ents.length+" ENTITÄTEN · "+(s.world?.relations?.length||0)+" VERBINDUNGEN · "+active+" AKTIV · "+gaps+" OFFENE BEDÜRFNISSE";
}
async function api(path,opts){const r=await fetch(path,opts);const j=await r.json();if(!r.ok||j.error)throw Error(j.error||r.status);return j}
async function refresh(){try{draw(await api("/api/state"))}catch(e){$("meta").textContent="WELT · FEHLER · "+e.message}}
$("sync").onclick=refresh;$("tick").onclick=async()=>{try{await api("/api/tick",{method:"POST"});refresh()}catch(e){show({name:"Zyklusfehler",type:"runtime",state:"failed",reason:e.message})}};
$("run").onclick=async()=>{try{await api(state?.runtime?.running?"/api/runtime/stop":"/api/runtime/start",{method:"POST"});refresh()}catch(e){show({name:"Runtimefehler",type:"runtime",state:"failed",reason:e.message})}};
$("close").onclick=()=>{$("inspector").style.display="none"};
let drag=false,last=[0,0];function apply(){svg.style.transform="translate("+view.x+"px,"+view.y+"px) scale("+view.z+")"}svg.addEventListener("wheel",e=>{e.preventDefault();view.z=Math.max(.45,Math.min(2.1,view.z*(e.deltaY<0?1.08:.93)));apply()},{passive:false});svg.addEventListener("pointerdown",e=>{if(e.target!==svg)return;drag=true;last=[e.clientX,e.clientY];svg.setPointerCapture(e.pointerId)});svg.addEventListener("pointermove",e=>{if(!drag)return;view.x+=e.clientX-last[0];view.y+=e.clientY-last[1];last=[e.clientX,e.clientY];apply()});svg.addEventListener("pointerup",()=>drag=false);refresh();setInterval(refresh,3000);
</script>
</body></html>
